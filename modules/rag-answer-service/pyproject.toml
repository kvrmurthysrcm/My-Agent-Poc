[project]
name = "rag-answer-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "openai>=2.14.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
