[project]
name = "rag-search-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "openai>=2.14.0",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.45",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
