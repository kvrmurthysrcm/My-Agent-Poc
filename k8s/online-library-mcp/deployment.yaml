apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-library-mcp
  namespace: rag-poc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: online-library-mcp
  template:
    metadata:
      labels:
        app: online-library-mcp
    spec:
      containers:
        - name: online-library-mcp
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: online-library-mcp-config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}

