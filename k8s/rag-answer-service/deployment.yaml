apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-answer-service
  namespace: rag-poc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rag-answer-service
  template:
    metadata:
      labels:
        app: rag-answer-service
    spec:
      containers:
        - name: rag-answer-service
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: rag-answer-service-config
          env:
            - name: OTEL_SERVICE_NAME
              value: rag-answer-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=rag-poc,deployment.environment=local
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://host.docker.internal:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
              value: click
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
