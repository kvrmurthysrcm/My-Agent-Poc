apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ai-agent
  namespace: rag-poc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: weather-ai-agent
  template:
    metadata:
      labels:
        app: weather-ai-agent
    spec:
      containers:
        - name: weather-ai-agent
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8007
          envFrom:
            - configMapRef:
                name: weather-ai-agent-config
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}

