apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-library-agent
  namespace: rag-poc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: online-library-agent
  template:
    metadata:
      labels:
        app: online-library-agent
    spec:
      containers:
        - name: online-library-agent
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8005
          envFrom:
            - configMapRef:
                name: online-library-agent-config
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 750m, memory: 512Mi}

